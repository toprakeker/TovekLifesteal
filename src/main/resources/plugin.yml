name: TovekLifesteal
version: 1.0.2
main: dev.toprak.lifesteal.LifestealPlugin
api-version: '1.20'
author: Toprak
description: Modern, high-performance Lifesteal SMP core with PDC hearts and craftable revives.

commands:
  lifesteal:
    description: Main command for TovekLifesteal
    usage: /lifesteal [reload|set|revive]
    aliases:
      - ls
  withdrawheart:
    description: Withdraw hearts into physical consumable items
    usage: /withdrawheart [amount]
    aliases:
      - withdraw
      - heartwithdraw
